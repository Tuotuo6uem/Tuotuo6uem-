<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳转页面</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://example.com/your-image.jpg') no-repeat center center;
      background-size: cover;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    a {
      display: inline-block;
      padding: 15px 30px;
      font-size: 16px;
      text-decoration: none;
      color: #fff;
      border-radius: 8px;
      background: linear-gradient(45deg, #ff4136, #ff8536, #ffcc36, #2196f3, #4caf50, #8bc34a, #ff5722, #f44336);
      background-size: 400% 400%;
      animation: gradient 5s ease infinite;
      transition: 0.3s;
    }

    a:hover {
      background: linear-gradient(45deg, #ff8536, #ffcc36, #2196f3, #4caf50, #8bc34a, #ff5722, #f44336, #ff4136);
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* 按钮文字居中显示 */
    a span {
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="button-container">
    <a href="https://www.163.com" target="_blank">
      <span>跳转Bilibili</span>
    </a>
    <a href="https://www.douyin.com" target="_blank">
      <span>跳转抖音</span>
    </a>
    <a href="https://jianghu.163.com/index.html" target="_blank">
      <span>下载网易一梦江湖</span>
    </a>
  </div>
</body>
</html>
