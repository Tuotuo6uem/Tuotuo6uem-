<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转页面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            font-family: system-ui, sans-serif;
        }
        a {
            display: inline-block;
            margin: 20px;
            padding: 15px 30px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <a href="https://www.bilibili.com" target="_blank">跳转Bilibili</a>
    <a href="https://www.douyin.com" target="_blank">跳转抖音</a>
</body>
</html>
